<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Reset password — HireTrack 360</title><link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <div class="auth-brand"><a class="brand" href="index.html"><span class="brand-mark">H</span> HireTrack <b>360</b></a></div>
    <section class="auth-card">
      <header class="auth-head"><div class="mini-icon">↻</div><h1>Reset your password</h1><p>Enter your account email and we will send a one-time reset link if an account exists.</p></header>
      <form id="forgotPasswordForm"><label>Email address<input name="email" type="email" required autocomplete="email" placeholder="you@example.com"></label><p class="auth-message" id="recoveryMessage" role="status" aria-live="polite" hidden></p><button class="btn btn-primary btn-full" type="submit">Send reset link</button></form>
      <p class="switch-auth"><a href="login.html">Back to sign in</a></p>
    </section>
  </main>
  <script src="js/api.js"></script><script src="js/auth-recovery.js"></script>
</body>
</html>
