<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Reset Password — HireTrack 360</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #fffdf8 0%, #f3f8f2 42%, #fffdf8 100%);
      color: #111;
    }
    .reset-page {
      width: 100%;
      min-height: 100vh;
      padding: 28px 30px 60px;
    }
    .reset-card {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }
    h1 {
      margin: 0 0 22px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(30px, 6vw, 42px);
      line-height: 1.1;
      font-weight: 700;
      color: #111;
    }
    form { width: 100%; }
    .field {
      display: block;
      width: 100%;
      margin-bottom: 10px;
    }
    .field input {
      width: 100%;
      height: 48px;
      border: 1px solid #ddd;
      border-radius: 7px;
      background: #fff;
      padding: 0 12px;
      font-size: 16px;
      outline: none;
      box-shadow: 0 1px 3px rgba(0,0,0,.04);
    }
    .field input:focus {
      border-color: #23855d;
      box-shadow: 0 0 0 2px rgba(35,133,93,.12);
    }
    .reset-button {
      width: 100%;
      height: 48px;
      margin-top: 0;
      border: 0;
      border-radius: 7px;
      background: #23855d;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,.14);
    }
    .reset-button:hover { background: #1d734f; }
    .reset-button:disabled { opacity: .65; cursor: wait; }
    .message {
      margin: 12px 0;
      font-size: 14px;
      color: #b42318;
    }
    .success { color: #176b45; }
    .back {
      display: block;
      margin-top: 18px;
      color: #176b45;
      text-decoration: none;
      font-size: 14px;
    }
    @media (max-width: 600px) {
      .reset-page { padding: 28px 29px 50px; }
      h1 { font-size: 32px; margin-bottom: 20px; }
    }
  </style>
</head>
<body>
  <main class="reset-page">
    <section class="reset-card">
      <h1>Reset Password</h1>

      <form id="resetPasswordForm" hidden>
        <label class="field">
          <input name="password" type="password" minlength="8"
                 autocomplete="new-password" placeholder="New password" required>
        </label>

        <label class="field">
          <input name="confirmPassword" type="password" minlength="8"
                 autocomplete="new-password" placeholder="Confirm new password" required>
        </label>

        <p class="message" id="recoveryMessage" role="alert" aria-live="polite" hidden></p>

        <button class="reset-button" type="submit">Reset Password</button>
      </form>

      <p class="message" id="tokenMessage" role="status" aria-live="polite">
        Checking reset link...
      </p>

      <a class="back" href="login.html">Back to sign in</a>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth-recovery.js"></script>
</body>
</html>
