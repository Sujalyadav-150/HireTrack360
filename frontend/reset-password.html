<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Choose a new password — HireTrack 360</title><link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <div class="auth-brand"><a class="brand" href="index.html"><span class="brand-mark">H</span> HireTrack <b>360</b></a></div>
    <section class="auth-card">
      <header class="auth-head"><div class="mini-icon">✓</div><h1>Choose a new password</h1><p>Use at least 8 characters. The reset link can only be used once.</p></header>
      <form id="resetPasswordForm" hidden><label>New password<input name="password" type="password" minlength="8" autocomplete="new-password" required></label><label>Confirm password<input name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></label><p class="auth-message" id="recoveryMessage" role="alert" aria-live="polite" hidden></p><button class="btn btn-primary btn-full" type="submit">Update password</button></form>
      <p class="auth-message" id="tokenMessage" role="status" aria-live="polite">Checking reset link...</p>
      <p class="switch-auth"><a href="login.html">Back to sign in</a></p>
    </section>
  </main>
  <script src="js/api.js"></script><script src="js/auth-recovery.js"></script>
</body>
</html>
