<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Create Account — HireTrack 360</title><link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
<div class="auth-shell">
  <div class="auth-brand"><a class="brand" href="index.html"><span class="brand-mark">H</span> HireTrack <b>360</b></a></div>
  <div class="auth-card signup-card">
    <div class="auth-head"><div class="mini-icon">+</div><h1>Create your account</h1><p>Start with the experience built for your role.</p></div>
    <div class="role-tabs">
      <button class="role-tab active" data-role="jobseeker"><span>👤</span><div><b>Job Seeker</b><small>Discover & track jobs</small></div></button>
      <button class="role-tab" data-role="recruiter"><span>💼</span><div><b>Recruiter</b><small>Hire better candidates</small></div></button>
    </div>
    <form id="signupForm">
      <input type="hidden" id="role" value="jobseeker">
      <div class="two-col">
        <label>Full name<input id="name" required maxlength="100" placeholder="Your name"></label>
          <label id="emailLabel">Email<input id="email" type="email" required maxlength="254" placeholder="you@example.com"></label>
      </div>
      <div id="dynamicFields"></div>
      <div class="two-col">
        <label>Password<div class="password-wrap"><input id="password" type="password" minlength="8" required placeholder="At least 8 characters"><button type="button" id="togglePass">Show</button></div></label>
        <label>Confirm password<input id="confirmPassword" type="password" minlength="8" required placeholder="Repeat password"></label>
      </div>
      <p class="auth-message" id="authMessage" role="alert" aria-live="polite" hidden></p>
      <button class="btn btn-primary btn-full" type="submit">Create account <span>→</span></button>
    </form>
    <p class="switch-auth">Already have an account? <a href="login.html">Sign in</a></p>
  </div>
</div>
<script src="js/api.js"></script><script src="js/auth.js"></script>
</body></html>
